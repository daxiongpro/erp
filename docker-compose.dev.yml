version: '3'

services:
  db:
    image: registry.cn-hangzhou.aliyuncs.com/tfh/mysql:8.0
    restart: always
    env_file:
      - ./mysql/.env
    volumes:
      - db_vol:/var/lib/mysql:rw
      - ./mysql/my.cnf:/etc/mysql/my.cnf
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - dev_network
  web:
    build: 
      context: ./frontend/               # 构建上下文目录
      dockerfile: Dockerfile.dev         # 指定要使用的 Dockerfile 文件名
    # command: yarn serve
    # command: yarn serve --host 0.0.0.0
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"  # 映射到宿主机，方便浏览器访问
    depends_on:
      - backend
    networks:
      - dev_network
  backend:
    build: ./django
    restart: always
    volumes:
      - ./django:/app:rw
      - ./uwsgi:/tmp
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - dev_network



networks:
  dev_network:
    driver: bridge

volumes:
  db_vol: